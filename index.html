<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desk O'clock</title>

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="/css/style.css">

    <!-- Fontawesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geomini:wght@200..800&display=swap" rel="stylesheet">

</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="brand">Desk O'clock</div>

        <nav class="navbar__controls">
            <button type="button" id="theme-toggle" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
            <button type="button" id="fullscreen-toggle" aria-label="Enter fullscreen"><i class="fa-solid fa-expand"></i></button>
            <button type="button" id="settings-toggle" aria-expanded="false"><i class="fa-solid fa-gear"></i></button>
            <!-- 
            Settings:
            - Change Time Format   (toggle button beside it 12H/24H)
            - Show Seconds         (toggle button beside it On/Off)
            
            Change Clock Type
            -->
        </nav>
    </header>

    <!-- Main -->
    <main class="main-contents">
        <div class="greeting">
            Hey there, <span class="greeting_day"></span>!
        </div>
        <div class="subtitle">
            It's currently
        </div>
        <section class="clock">
            <time class="clock_time"></time>
            <div class="clock_date-formatter">
                <time class="clock_date"></time>
                <p>•</p>
                <div class="clock_weekday"></div>
            </div>
        </section>
    </main>

    <!-- JavaScript -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
