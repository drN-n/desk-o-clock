<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Desk O'clock</title>

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="/css/style.css">

    <!-- Fontawesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="brand">Desk O'clock</div>

        <nav class="navbar__controls">
            <button type="button" id="theme-toggle" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>

            <!-- Sets the page to fullscreen mode -->
            <button type="button" id="fullscreen-toggle" aria-label="Enter fullscreen"><i class="fa-solid fa-expand"></i></button>
            
            <!-- Settings button -->
            <button type="button" id="settings-toggle" aria-expanded="false" aria-controls="settings-panel"><i class="fa-solid fa-gear"></i></button>
            
            <!-- Settings panel/menu -->
            <div class="settings-panel" id="settings-panel" hidden>
                <div class="settings-panel__title">Settings</div>
                <div class="settings-panel__row">
                    <span>Time Format</span>
                    <button type="button" id="format-toggle">12H</button>
                </div>
                <div class="settings-panel__row">
                    <span>Show Seconds</span>
                    <button type="button" id="seconds-toggle">On</button>
                </div>
                <div class="settings-panel__row settings-panel__row--column">
                    <span>Clock Style</span>
                    <div class="theme-picker" id="theme-picker" role="group" aria-label="Clock style">
                        <button type="button" class="theme-picker__option" data-theme-id="split-flap">Split-Flap</button>
                        <button type="button" class="theme-picker__option" data-theme-id="ambient-daylight">Ambient</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main -->
    <main class="main-contents">
        <div class="greeting">
            <span class="greeting_day"></span>
        </div>
        <section class="clock">
            <!-- Split Flap -->
             <div class="theme-face theme-face--split-flap">
                <div class="clock_display">
                    <div class="clock_board" id="clock-board" aria-hidden="true"></div>
                    <div class="clock_period" id="clock-period" hidden></div>
                </div>
             </div>
            
            <!-- Ambient Daylight -->
            <div class="theme-face theme-face--ambient-daylight">
                <time class="ambient_time" id="ambient-time"></time>
            </div>

            <time class="sr-only" id="clock-sr-time"></time>
            <div class="clock_date-formatter">
                <time class="clock_date"></time>
                <p>•</p>
                <div class="clock_weekday"></div>
            </div>
        </section>
    </main>

    <!-- JavaScript -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
