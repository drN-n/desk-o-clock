<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desk O'clock</title>

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="/css/style.css">

    <!-- Fontawesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">

    <!-- Fonts -->

    <!-- JavaScript -->
    <script src=""></script>
</head>
<body>
    <header class="navbar">
        <div class="brand">Desk O'clock</div>

        <nav class="navbar__controls">
            <button type="button" id="theme-toggle" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
            <button type="button" id="fullscreen-toggle" aria-label="Enter fullscreen"><i class="fa-solid fa-expand"></i></button>
            <button type="button" id="settings-toggle" aria-expanded="false"><i class="fa-solid fa-gear"></i></button>
            <!-- 
            Settings:
            - Change Time Format   (toggle button beside it 12H/24H)
            - Show Seconds         (toggle button beside it On/Off)
            
            Change Clock Type
            -->
        </nav>
    </header>
    <main class="main-contents">
        <div class="greeting">
            <!-- Time-based greetings. Will vary depending on user's current time -->
            Hey there, good morning!
        </div>
        <div class="subtitle">
            It's currently
        </div>
        <section class="clock">
            <time class="time">
                <!-- 
                Default Time Format: 12H
                Format: Hours | Minutes | Seconds (seconds can be ON/OFF)
                -->

                12:00:00<span class="am-pm">AM</span>
            </time>
            <time class="date">
                <!-- 
                Format: DD | MM | YYYY • DAY
                -->

                July 20, 2026 • <span class="week-day">Monday</span>
            </time>
        </section>
    </main>
</body>
</html>
